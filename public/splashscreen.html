<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading ChronoFlow...</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .loader-container {
      background: rgba(15, 15, 20, 0.95);
      width: 320px;
      height: 320px;
      border-radius: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 
                  inset 0 0 20px rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
    }

    .hexagon-wrapper {
      position: relative;
      width: 100px;
      height: 100px;
      margin-bottom: 30px;
    }

    .hexagon {
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(45deg, #ff3d77, #9c27b0, #3f51b5);
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      animation: pulse 2s ease-in-out infinite;
    }

    .hexagon-inner {
      position: absolute;
      top: 4px;
      left: 4px;
      width: calc(100% - 8px);
      height: calc(100% - 8px);
      background: #0f0f14;
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      z-index: 1;
    }

    .loading-text {
      color: white;
      font-weight: 900;
      font-size: 14px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      margin-top: 10px;
      opacity: 0.8;
      animation: blink 1.5s ease-in-out infinite;
    }

    .progress-bar {
      width: 120px;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      margin-top: 20px;
      overflow: hidden;
    }

    .progress-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #ff3d77, #3f51b5);
      transform-origin: left;
      animation: progress 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); filter: brightness(1) drop-shadow(0 0 5px rgba(255, 61, 119, 0.5)); }
      50% { transform: scale(1.05); filter: brightness(1.2) drop-shadow(0 0 15px rgba(255, 61, 119, 0.8)); }
    }

    @keyframes blink {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.9; }
    }

    @keyframes progress {
      0% { transform: translateX(-100%) scaleX(0.1); }
      50% { transform: translateX(0) scaleX(0.5); }
      100% { transform: translateX(100%) scaleX(0.1); }
    }
  </style>
</head>
<body>
  <div class="loader-container">
    <div class="hexagon-wrapper">
      <div class="hexagon"></div>
      <div class="hexagon-inner"></div>
    </div>
    <div class="loading-text">ChronoFlow</div>
    <div class="progress-bar">
      <div class="progress-fill"></div>
    </div>
  </div>
</body>
</html>
